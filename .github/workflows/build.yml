name: Build

on:
  push:
    branches: [ "main", "dev1", "ci" ]
    paths-ignore:
      - '**.md'
      - '.github/**'
      - '!.github/workflows/build.yml'
  workflow_call:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_HARDLINK: "true"
      CCACHE_NOHASHDIR: "true"
      CCACHE_MAXSIZE: "10G"
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "build-tools;36.1.0 ndk;27.3.13750724 platforms;android-36"

      - name: Configure Gradle
        run: |
          mkdir -p ~/.gradle
          echo 'org.gradle.caching=true' >> ~/.gradle/gradle.properties
          echo 'org.gradle.parallel=true' >> ~/.gradle/gradle.properties
          echo 'org.gradle.jvmargs=-Xmx8192m -Dfile.encoding=UTF-8 -XX:+UseParallelGC' >> ~/.gradle/gradle.properties
          echo 'android.native.buildOutput=verbose' >> ~/.gradle/gradle.properties

      - name: Configure Secrets
        run: |
          echo "apiId=${{ secrets.API_ID }}" >> local.properties
          echo "apiHash=${{ secrets.API_HASH }}" >> local.properties

      - name: Validate keystore secrets
        run: |
          if [ -z "${{ secrets.KEYSTORE_FILE }}" ]; then echo "::error::Missing secret: KEYSTORE_FILE"; exit 1; fi
          if [ -z "${{ secrets.KEYSTORE_PASSWORD }}" ]; then echo "::error::Missing secret: KEYSTORE_PASSWORD"; exit 1; fi
          if [ -z "${{ secrets.KEY_ALIAS }}" ]; then echo "::error::Missing secret: KEY_ALIAS"; exit 1; fi
          if [ -z "${{ secrets.KEY_PASSWORD }}" ]; then echo "::error::Missing secret: KEY_PASSWORD"; exit 1; fi
          echo "All keystore secrets are present."

      - name: Decode and verify keystore
        run: |
          mkdir -p TMessagesProj/config
          echo "${{ secrets.KEYSTORE_FILE }}" | base64 --decode > TMessagesProj/config/release.keystore
          echo "Decoded $(wc -c < TMessagesProj/config/release.keystore) bytes"
          keytool -list -keystore TMessagesProj/config/release.keystore \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -alias "${{ secrets.KEY_ALIAS }}" \
            -keypass "${{ secrets.KEY_PASSWORD }}" \
            -J-Dfile.encoding=UTF-8

      - name: Write signing config to gradle.properties
        run: |
          echo "RELEASE_STORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> gradle.properties
          echo "RELEASE_KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> gradle.properties
          echo "RELEASE_KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> gradle.properties

      - name: Build debug APK
        run: ./gradlew assembleAfatDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: debug-apk
          path: TMessagesProj_App/build/outputs/apk/afat/debug/*.apk
          archive: false
