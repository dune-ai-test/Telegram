name: Check Keystore

on:
  workflow_dispatch:
  push:
    branches: [ "ci" ]
    paths:
      - '.github/workflows/check-keystore.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check required secrets exist
        run: |
          if [ -z "${{ secrets.KEYSTORE_FILE }}" ]; then
            echo "::error::Missing secret: KEYSTORE_FILE"
            exit 1
          fi
          if [ -z "${{ secrets.KEYSTORE_PASSWORD }}" ]; then
            echo "::error::Missing secret: KEYSTORE_PASSWORD"
            exit 1
          fi
          if [ -z "${{ secrets.KEY_ALIAS }}" ]; then
            echo "::error::Missing secret: KEY_ALIAS"
            exit 1
          fi
          if [ -z "${{ secrets.KEY_PASSWORD }}" ]; then
            echo "::error::Missing secret: KEY_PASSWORD"
            exit 1
          fi
          echo "All secrets are present."

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_FILE }}" | base64 --decode > release.keystore
          echo "Decoded $(wc -c < release.keystore) bytes"

      - name: Validate keystore store password
        run: |
          keytool -list -keystore release.keystore \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -J-Dfile.encoding=UTF-8
          echo "::notice::Store password is valid"

      - name: Validate key alias and key password
        run: |
          keytool -list -keystore release.keystore \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -alias "${{ secrets.KEY_ALIAS }}" \
            -keypass "${{ secrets.KEY_PASSWORD }}" \
            -J-Dfile.encoding=UTF-8
          echo "::notice::Key alias '${{ secrets.KEY_ALIAS }}' and key password are valid"

      - name: Validate keystore certificate info
        run: |
          echo "### Keystore Certificate Info" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          keytool -list -keystore release.keystore \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -alias "${{ secrets.KEY_ALIAS }}" \
            -keypass "${{ secrets.KEY_PASSWORD }}" \
            -v -J-Dfile.encoding=UTF-8 >> $GITHUB_STEP_SUMMARY 2>&1
          echo '```' >> $GITHUB_STEP_SUMMARY
